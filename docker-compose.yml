# 大狗嚼电竞管理系统 - Docker Compose 编排
# 启动：docker compose up -d
# 查看日志：docker compose logs -f backend
# 停止：docker compose down

services:
  # ===== MySQL 数据库 =====
  mysql:
    image: mysql:8.0
    container_name: dgeq-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: game_escort_club
      MYSQL_USER: game_escort
      MYSQL_PASSWORD: "123456"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123456"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ===== Neo4j 知识图谱 =====
  neo4j:
    image: neo4j:5-community
    container_name: dgeq-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/neo4j123456
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"   # 浏览器界面
      - "7687:7687"   # Bolt 协议
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  # ===== 后端 FastAPI =====
  backend:
    build: .
    container_name: dgeq-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      neo4j:
        condition: service_started
    environment:
      # 数据库
      DB_ENGINE: mysql
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: game_escort
      MYSQL_PASSWORD: "123456"
      MYSQL_DB: game_escort_club
      # 知识图谱
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: neo4j123456
      # 通义千问 API Key（从 .env 读取，或在这里直接填）
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      # 模型配置（可选）
      QWEN_MODEL: ${QWEN_MODEL:-qwen-plus}
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/chroma_db
      - qdrant_data:/app/qdrant_db
      # 静态资源（头像、壁纸、知识库图片）映射出来方便管理
      - ./frontend:/frontend:ro
      - ./bizhiku:/bizhiku:ro
      - ./touxiangku:/touxiangku:ro
      - ./kb_images:/kb_images

  # ===== 前端 Nginx 静态服务 =====
  frontend:
    image: nginx:alpine
    container_name: dgeq-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mysql_data:
  neo4j_data:
  neo4j_logs:
  chroma_data:
  qdrant_data:
